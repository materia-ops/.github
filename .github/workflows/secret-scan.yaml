---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Secret Scan (reusable)

# Report-only secret scan (gitleaks) of the calling repo's tree and history.
# A finding fails the run and names file, line and rule, never the value.
# No inputs; a caller's exceptions are .github/secret-scan-exceptions.toml.
on:
  workflow_call:

permissions: {}

jobs:
  gitleaks:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history scan needs every commit reachable from HEAD.
          fetch-depth: 0
          persist-credentials: false

      # The MIT binary, not gitleaks-action: on an org repo the action needs
      # a licence key held as a repo secret.
      - name: Install gitleaks (pinned by checksum)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # The rules sit in this file, not in the caller's repo or a second
      # checkout, so a caller pinned to a commit runs exactly that commit's rules.
      - name: Write the rules
        run: |
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'TOML'
          [extend]
          useDefault = true

          [[rules]]
          id = "materia-1password-service-account"
          description = "1Password service-account token"
          regex = '''ops_ey[A-Za-z0-9_.-]{20,}'''

          # The encodings of "PRIVATE" are the discriminator, so public CERTIFICATE
          # data stays clean.
          [[rules]]
          id = "materia-b64-private-key"
          description = "base64-armored PEM private key"
          regex = '''LS0tLS1CRUdJTi[A-Za-z0-9+/]*(UFJJVkFURS|QUklWQVRF|BSSVZBVEU)'''

          # The value class excludes line breaks: with them in, an empty value
          # takes the next line as its value.
          [[rules]]
          id = "materia-keyword-value"
          description = "keyword=value credential shape"
          regex = '''[A-Za-z_-]*(TOKEN|SECRET|PASSPHRASE|PASSWORD|PASSWD|API[-_]?KEY|ACCESS_KEY)["']?[ \t]*[=:][ \t]*["']?[^ \t\r\n"'$({]{20,}'''

          # The allowlist covers the WHOLE match, ^ to $. The value class takes
          # in , & ; = and :, so an unanchored entry would also drop a real
          # value that shares the match with the reference.
          [[rules.allowlists]]
          description = "one assignment whose value is a 1Password reference; only closing punctuation may follow"
          # gitleaks takes this rule's "secret" to be the keyword group, so the
          # default target would never see the value.
          regexTarget = "match"
          regexes = ['''^[A-Za-z_-]+["']?[ \t]*[=:][ \t]*["']?op://[A-Za-z0-9_./-]+[`.,;)]*$''']

          [[rules]]
          id = "materia-kubeconfig-client-key"
          description = "kubeconfig embedded client key"
          regex = '''client-key-data[ \t]*:[ \t]*\S+'''

          # A regex reads like the value it excuses, so without this the regex
          # lines of a caller's exceptions file would be findings.
          [[allowlists]]
          description = "a regex string of the exceptions file; its other lines are still scanned"
          # Filled with every rule id by the next step: an allowlist with paths
          # that names no rule makes `gitleaks dir` skip the whole file.
          targetRules = []
          condition = "AND"
          paths = ['''^\.github/secret-scan-exceptions\.toml$''']
          regexTarget = "line"
          # The line may hold nothing but strings that start with ^, so a value
          # beside a regex is still a finding. \x27 and \x22 are the two quote
          # characters; gitleaks hands over the line with the line break before it.
          regexes = ['''^\n?[ \t]*(?:regexes[ \t]*=[ \t]*\[[ \t]*)?(?:(?:\x27{3}\^[^\x27]*(?:\x27{1,2}[^\x27]+)*\x27{3}|\x22{3}\^(?:[^\x22\\]|\\.|\x22{1,2}[^\x22\\])*\x22{3}|\x27\^[^\x27]*\x27|\x22\^(?:[^\x22\\]|\\.)*\x22)[ \t]*,?[ \t]*)+\]?[ \t\r]*$''']
          TOML

      # A step of its own, to stay under about 4 KB: actionlint on Windows hangs
      # when it pipes a longer run script to shellcheck.
      - name: Add the caller's exceptions
        run: |
          mkdir "$RUNNER_TEMP/empty" "$RUNNER_TEMP/probes"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/empty" --config "$RUNNER_TEMP/gitleaks.toml" --no-banner \
            --log-level error --report-format sarif --report-path "$RUNNER_TEMP/rules.sarif"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json
          import os
          import sys
          import tomllib

          source = ".github/secret-scan-exceptions.toml"
          temp = sys.argv[1]


          def table(**fields):
              values = [f"{key} = {json.dumps(value, ensure_ascii=False)}" for key, value in fields.items()]
              return ["", "[[allowlists]]"] + values


          def refuse(why):
              print(f"::error file={source},title=Secret scan::{why}")
              sys.exit(1)


          def text(value):
              return isinstance(value, str) and value.strip() != ""


          def texts(value):
              return isinstance(value, list) and value != [] and all(map(text, value))


          def anchored(regex):
              body = regex[:-1]
              escapes = len(body) - len(body.rstrip("\\"))
              return regex.startswith("^") and regex.endswith("$") and escapes % 2 == 0


          try:
              with open(source, "rb") as handle:
                  document = tomllib.load(handle)
          except FileNotFoundError:
              document = {}
          except (OSError, ValueError) as problem:
              refuse(f"cannot be read as TOML: {problem}")

          entries = document.get("allowlists", [])
          if set(document) - {"allowlists"} or not isinstance(entries, list):
              refuse("only [[allowlists]] tables are accepted")

          with open(os.path.join(temp, "rules.sarif"), encoding="utf-8") as handle:
              driver = json.load(handle)["runs"][0]["tool"]["driver"]
          every = json.dumps(sorted(rule["id"] for rule in driver["rules"]))
          with open(os.path.join(temp, "gitleaks.toml"), encoding="utf-8") as handle:
              rules = handle.read()
          if rules.count("\ntargetRules = []\n") != 1:
              sys.exit("the rules must hold exactly one empty targetRules line to fill")
          lines = [rules.replace("\ntargetRules = []\n", f"\ntargetRules = {every}\n").rstrip("\n")]

          # Only these four fields reach gitleaks, so the file cannot add a rule,
          # loosen one, or excuse a whole path or commit.
          fields = {"description", "regexTarget", "regexes", "targetRules"}
          for number, entry in enumerate(entries, 1):
              where = f"[[allowlists]] entry {number}"
              if not isinstance(entry, dict) or set(entry) != fields:
                  refuse(f"{where} needs exactly description, targetRules, regexTarget and regexes")
              if not text(entry["description"]):
                  refuse(f"{where}: description must give the reason")
              if not texts(entry["targetRules"]):
                  refuse(f"{where}: targetRules must name the rules it answers")
              if entry["regexTarget"] != "match":
                  refuse(f'{where}: regexTarget must be "match"')
              if not texts(entry["regexes"]) or not all(map(anchored, entry["regexes"])):
                  refuse(f"{where}: each regex must cover the whole match, from ^ to $")
              # Wrapped again: in ^a|b$ each anchor binds one side only.
              whole = [f"^(?:{regex})$" for regex in entry["regexes"]]
              lines += table(
                  description=entry["description"],
                  targetRules=entry["targetRules"],
                  regexTarget="match",
                  regexes=whole,
              )
              probe = ["[[rules]]", 'id = "probe"', 'regex = "x"']
              for regexes in (entry["regexes"], whole):
                  probe += table(targetRules=["probe"], regexTarget="match", regexes=regexes)
              with open(os.path.join(temp, "probes", f"{number}.toml"), "w", encoding="utf-8") as handle:
                  handle.write("\n".join(probe) + "\n")

          with open(os.path.join(temp, "gitleaks.toml"), "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      # gitleaks must accept each regex as written: one that closes a group it
      # never opened would close the wrap early. The output is dropped because
      # a compile error echoes the pattern.
      - name: Check that gitleaks accepts each exception
        run: |
          entry=1
          while [ -e "$RUNNER_TEMP/probes/$entry.toml" ]; do
            if ! "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/empty" --config "$RUNNER_TEMP/probes/$entry.toml" --no-banner > /dev/null 2>&1; then
              echo "::error file=.github/secret-scan-exceptions.toml,title=Secret scan::[[allowlists]] entry $entry: gitleaks does not accept its regexes as written"
              exit 1
            fi
            entry=$((entry + 1))
          done

      # A scan that cannot fail is a dead control. Each fixture is named after
      # the one rule that must flag it, and `clean` after none. Assembled at
      # runtime: a full match here would flag this file.
      - name: Prove the rules still fire
        run: |
          mkdir -p "$RUNNER_TEMP/canary/.github"
          cd "$RUNNER_TEMP/canary" || exit 1
          low=aaaaaaaaaaaaaaaaaaaaaaaa
          printf 'PASS%s=\n%s\n' PHRASE "$low" > clean
          printf 'ghp_%sZz9Q\n' 0123456789abcdef0123456789abcdef > github-pat
          printf 'ops_%s%s\n' ey "$low" > materia-1password-service-account
          printf 'LS0tLS1CRUdJTiBQ%s\n' UklWQVRFIEtFWQ > materia-b64-private-key
          printf 'PASS%s=%s\n' PHRASE "$low" > materia-keyword-value
          printf 'client-key-%s %s\n' data: "$low" > materia-kubeconfig-client-key
          # In an exceptions file the regex line must stay clean and the line
          # after it must not: that second line proves the file is still scanned.
          exceptions=.github/secret-scan-exceptions.toml
          printf "regexes = ['''^PASS%s=%s\$''']\ndescription = \"PASS%s=%s\"\n" PHRASE "$low" PHRASE "$low" > "$exceptions"
          want="$exceptions:2=materia-keyword-value"
          for rule in github-pat materia-1password-service-account materia-b64-private-key materia-keyword-value materia-kubeconfig-client-key; do
            want="$want $rule:1=$rule"
          done
          rc=0
          "$RUNNER_TEMP/gitleaks" dir . --config "$RUNNER_TEMP/gitleaks.toml" --no-banner --redact \
            --log-level error --exit-code 9 --report-format json --report-path "$RUNNER_TEMP/canary.json" || rc=$?
          got=$(jq -r '[.[] | "\(.File):\(.StartLine)=\(.RuleID)"] | unique | join(" ")' "$RUNNER_TEMP/canary.json" || true)
          if [ "$rc" -ne 9 ] || [ "$got" != "$want" ]; then
            echo "::error title=Secret scan::canary failed (exit $rc; saw: ${got:-no rule fire}): the rules are not behaving as written, treat the repo as UNSCANNED"
            exit 1
          fi
          echo "canary: each fixture was flagged by its own rule and no other, and each clean line by none"

      - name: Scan the tree and its history
        run: |
          fail=0
          # gitleaks reads a root .gitleaksignore whatever its flags, so it is
          # refused: exceptions come from the one validated file. Inline allow
          # comments are ignored as well.
          if [ -e .gitleaksignore ]; then
            fail=1
            echo "::error file=.gitleaksignore,title=Secret scan::.gitleaksignore is refused: record the exception in .github/secret-scan-exceptions.toml with its reason"
            mv .gitleaksignore "$RUNNER_TEMP/gitleaksignore.refused"
          fi
          scan() {
            local label="$1" rc=0 report="$RUNNER_TEMP/gitleaks-$1.json"
            shift
            "$RUNNER_TEMP/gitleaks" "$@" --config "$RUNNER_TEMP/gitleaks.toml" --no-banner --redact \
              --ignore-gitleaks-allow --exit-code 9 --report-format json --report-path "$report" || rc=$?
            if [ "$rc" -eq 9 ]; then
              fail=1
              # Never print Match or Secret: --redact masks the capture group only,
              # which leaves the value in Match for materia-keyword-value and
              # materia-b64-private-key.
              jq -r --arg label "$label" '
                def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
                def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
                .[] |
                if $label == "tree"
                then "::error file=\(.File | prop),line=\(.StartLine),title=Secret scan::\(.File | esc):\(.StartLine) matches rule \(.RuleID)"
                else "::error title=Secret scan (history)::\(.File | esc):\(.StartLine) in commit \(.Commit[0:8]) matches rule \(.RuleID)"
                end' "$report"
            elif [ "$rc" -ne 0 ]; then
              fail=1
              echo "::error title=Secret scan::gitleaks exited $rc on the $label scan: treat it as UNSCANNED"
            fi
            rm -f "$report"
          }
          scan tree dir .
          # Plain `git log -p` prints no diff for a merge commit, so a value
          # that only a merge introduced would be skipped without this.
          scan history git . --log-opts="--diff-merges=first-parent HEAD"
          if [ "$fail" -ne 0 ]; then
            echo "Values are never printed here. Deleting the line does not clear a finding: the history scan still sees it."
            exit 1
          fi
