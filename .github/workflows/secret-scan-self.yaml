---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Secret Scan

# This repo's own call of the shared secret scan, and the file another repo
# copies to adopt it (CLAUDE.md, Contents).
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Cancelling on main loses nothing: the newest run rescans the whole tree
# and history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret Scan - Call
    permissions:
      contents: read # the called job checks out this repo
    # A local path here only, so a PR that changes the scan runs its own
    # version. Not the `$/` form zizmor suggests: actionlint 1.7.12 rejects it.
    uses: ./.github/workflows/secret-scan.yaml # zizmor: ignore[self-repository]
